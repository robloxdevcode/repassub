# fly.toml app configuration file generated for repassub on 2026-09-26T08:48:43Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'repassub'
primary_region = 'ams'

[build]

[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
